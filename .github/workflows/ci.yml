# Continuous integration: every push to main and every pull request runs the
# same checks you run locally, on a clean machine, for each supported Python.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual "Run workflow" button

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # report every combination, do not stop at the first failure
      matrix:
        os: [ubuntu-latest, windows-latest] # Windows = the real development environment
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.3 # setup-uv no longer publishes floating major tags
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project (editable) and dev tools from uv.lock
        run: uv sync --locked

      - name: Show interpreter and installed package
        run: uv run python -c "import sys, dedpath; print(sys.version); print('dedpath', dedpath.__version__)"

      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy strict)
        run: uv run mypy src

      - name: Tests (pytest + coverage)
        run: uv run pytest --cov --cov-report=term-missing
        env:
          HYPOTHESIS_PROFILE: ci

  build:
    name: build and inspect wheel
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Wheel must contain the dialect profile and the py.typed marker
        run: |
          unzip -l dist/*.whl
          unzip -l dist/*.whl | grep -q 'dedpath/dialects/profiles/sinumerik_generic.yaml'
          unzip -l dist/*.whl | grep -q 'dedpath/py.typed'

      - name: Install the wheel in a clean venv (not editable) and load the profile
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/python -c "from importlib.resources import files; p = files('dedpath') / 'dialects' / 'profiles' / 'sinumerik_generic.yaml'; assert p.is_file(), p; print('OK', p)"
